<ul class="list-group">
    @for (todo of todos; track todo) {
    <li
        class="list-group-item"
        [ngClass]="{ active: selectedTodo?.id === todo.id }"
        (click)="selectTodo.emit(todo)"
    >
        {{ todo.title }}
        @if (todo.isBusiness) {
        <span class="badge badge-info mr-1">Business</span>
        } @if (todo.isPrivate) {
        <span class="badge badge-primary">Private</span>
        }
    </li>
    }
</ul>
